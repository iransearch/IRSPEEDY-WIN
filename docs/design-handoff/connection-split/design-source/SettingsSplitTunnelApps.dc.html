<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>آی‌آر اسپیدی — تقسیم تونل / برنامه‌ها</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
  body { margin: 0; font-family: 'Vazirmatn', system-ui, sans-serif; }
  .irs-close:hover { transform: scale(1.06); }
  .irs-field:focus-within { border-color: #1E3A8A; box-shadow: 0 0 0 3px rgba(30,58,138,0.12); }
  .irs-row:hover { border-color: #D8DCE6; box-shadow: 0 4px 12px rgba(16,24,40,0.07); }
  .irs-row { transition: box-shadow 0.15s ease, border-color 0.15s ease; }
  .irs-toggle-btn:focus-visible { outline: 2px solid #1E3A8A; outline-offset: 2px; }
  .irs-add:hover { background: #EEF3FC; border-color: #A9BCE3; }
  .irs-remove:hover { background: #FDECEC; }
  .irs-confirm:hover { box-shadow: 0 12px 24px -8px rgba(30,58,138,0.5); transform: translateY(-1px); }
</style>
</helmet>

<div dir="rtl" style="width: 1280px; height: 860px; box-sizing: border-box; position: relative; display: flex; align-items: center; justify-content: center; background: radial-gradient(1100px 700px at 78% 12%, #EAF1FB 0%, #DCE6F5 38%, #CBD8ED 100%); overflow: hidden; font-family: 'Vazirmatn', sans-serif;">

  <!-- soft desktop taskbar hint, for context only -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: rgba(255,255,255,0.35); backdrop-filter: blur(6px); border-top: 1px solid rgba(255,255,255,0.5);"></div>

  <!-- floating window -->
  <div dir="rtl" style="width: 420px; height: 700px; box-sizing: border-box; border-radius: 20px; background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%); box-shadow: 0 40px 80px -24px rgba(23,35,64,0.35), 0 0 0 1px rgba(255,255,255,0.6) inset; display: flex; flex-direction: column; overflow: hidden;">

    <!-- header -->
    <div style="height: 62px; flex-shrink: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: 0 18px; border-bottom: 1px solid #EEF0F4;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 1px;">
        <span style="font-size: 16px; font-weight: 800; color: #141B33; letter-spacing: 0.2px;">تقسیم تونل</span>
        <span style="font-size: 10.5px; font-weight: 500; color: #9CA3B4;">انتخاب برنامه‌هایی که از تونل عبور کنند</span>
      </div>
      <button aria-label="بستن" class="irs-close" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; border: none; background: linear-gradient(180deg, #EF4444 0%, #DC2626 100%); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 14px -4px rgba(220,38,38,0.5); transition: transform 0.15s ease;">
        <svg width="12" height="12" viewBox="0 0 13 13" fill="none"><line x1="1.5" y1="1.5" x2="11.5" y2="11.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/><line x1="11.5" y1="1.5" x2="1.5" y2="11.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- content -->
    <div style="box-sizing: border-box; flex-grow: 1; min-height: 0; display: flex; flex-direction: column; padding: 14px 18px 0; gap: 10px;">

      <!-- activation toggle (moved here from the connection-methods screen) -->
      <div style="box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #F5F7FB; flex-shrink: 0;">
        <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
          <span style="font-size: 13px; font-weight: 700; color: #1B2033;">فعال‌سازی تقسیم تونل</span>
          <span style="font-size: 10.5px; color: {{splitStatusColor}};">{{splitStatusLabel}}</span>
        </div>
        <button aria-label="فعال یا غیرفعال کردن تقسیم تونل" class="irs-toggle-btn" onClick="{{toggleSplit}}" dir="ltr" style="width: 46px; height: 26px; border-radius: 999px; flex-shrink: 0; box-sizing: border-box; padding: 3px; border: none; cursor: pointer; display: flex; background: {{splitTrackBg}};">
          <div style="width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 4px rgba(16,24,40,0.25); margin-inline-start: {{splitThumbOffset}}; transition: margin-inline-start 0.15s ease;"></div>
        </button>
      </div>

      <!-- everything below is disabled (dimmed) while split tunnel is off -->
      <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; opacity: {{listOpacity}}; pointer-events: {{listPointer}}; transition: opacity 0.2s ease;">

      <!-- search -->
      <label class="irs-field" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #E1E4EC; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,24,40,0.03); flex-shrink: 0; transition: border-color 0.15s ease, box-shadow 0.15s ease;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5.25" stroke="#9CA3B4" stroke-width="1.5"/><line x1="11" y1="11" x2="14.5" y2="14.5" stroke="#9CA3B4" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input type="text" dir="rtl" placeholder="جستجوی برنامه" aria-label="جستجوی برنامه" style="border: none; outline: none; background: transparent; font-size: 14px; color: #1F2433; font-family: inherit; flex-grow: 1; text-align: right;">
      </label>

      <!-- add an app manually (pick an .exe from disk) -->
      <button class="irs-add" style="flex-shrink: 0; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px dashed #C3D0EA; background: #F7F9FD; cursor: pointer; font-family: inherit; transition: background 0.15s ease, border-color 0.15s ease;">
        <span style="width: 22px; height: 22px; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M6 1.5v9M1.5 6h9" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/></svg>
        </span>
        <span style="font-size: 13px; font-weight: 700; color: {{accent}}; flex-grow: 1; text-align: right;">افزودن برنامه</span>
      </button>

      <!-- select-all row -->
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 2px; flex-shrink: 0;">
        <span style="font-size: 11.5px; color: #6B7280;">{{selectedCount}} برنامه انتخاب شده</span>
        <button style="border: none; background: transparent; font-size: 11.5px; font-weight: 700; color: {{accent}}; cursor: pointer; font-family: inherit;">انتخاب همه</button>
      </div>

      <!-- app list -->
      <div style="flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px;">
        <sc-for list="{{apps}}" as="app" hint-placeholder-count="8">
          <div class="irs-row" style="box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 14px; background: #FFFFFF; border: 1px solid #ECEEF3; box-shadow: 0 1px 3px rgba(16,24,40,0.03);">

            <!-- app icon badge -->
            <div style="width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{app.tint}}; color: {{app.color}};">
              <sc-if value="{{app.isBrowser}}" hint-placeholder-val="{{true}}">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.7"/><path d="M4 12h16" stroke="currentColor" stroke-width="1.7"/><path d="M12 4c-3 2.6-3 13.4 0 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M12 4c3 2.6 3 13.4 0 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              </sc-if>
              <sc-if value="{{app.isChat}}" hint-placeholder-val="{{false}}">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 6.5h16a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5H9l-4 3v-3H4A1.5 1.5 0 0 1 2.5 16V8A1.5 1.5 0 0 1 4 6.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
              </sc-if>
              <sc-if value="{{app.isGame}}" hint-placeholder-val="{{false}}">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="8" width="19" height="9" rx="4.5" stroke="currentColor" stroke-width="1.6"/><path d="M7 10.3v4.4M5 12.5h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="16" cy="11" r="1" fill="currentColor"/><circle cx="18.2" cy="13.2" r="1" fill="currentColor"/></svg>
              </sc-if>
              <sc-if value="{{app.isMusic}}" hint-placeholder-val="{{false}}">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M9 17.5a2.2 2.2 0 1 1 0-4.4 2.2 2.2 0 0 1 0 4.4Z" stroke="currentColor" stroke-width="1.6"/><path d="M11.2 15.3V5.8L18 4.3v9.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.8 16.1a2.2 2.2 0 1 1 0-4.4 2.2 2.2 0 0 1 0 4.4Z" stroke="currentColor" stroke-width="1.6"/></svg>
              </sc-if>
              <sc-if value="{{app.isMail}}" hint-placeholder-val="{{false}}">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="5.5" width="18" height="13" rx="2.2" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </sc-if>
              <sc-if value="{{app.isFile}}" hint-placeholder-val="{{false}}">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M6.5 2.8h7.2l4.8 4.8v12a1.6 1.6 0 0 1-1.6 1.6H6.5a1.6 1.6 0 0 1-1.6-1.6V4.4a1.6 1.6 0 0 1 1.6-1.6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M13.5 3v4.8h4.8" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.5 13h7M8.5 16.5h4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              </sc-if>
              <sc-if value="{{app.isVideo}}" hint-placeholder-val="{{false}}">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="6.5" width="13" height="11" rx="2.2" stroke="currentColor" stroke-width="1.6"/><path d="M15.5 10.2l6-3.3v10.2l-6-3.3" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
              </sc-if>
            </div>

            <!-- name + subtitle -->
            <div style="display: flex; flex-direction: column; gap: 0px; flex-grow: 1; min-width: 0;">
              <span style="font-size: 13px; font-weight: 700; color: #1B2033;">{{app.name}}</span>
              <span style="font-size: 10px; color: #9CA3B4;">{{app.category}}</span>
            </div>

            <!-- manually-added apps can be removed from the list -->
            <sc-if value="{{app.isCustom}}" hint-placeholder-val="{{false}}">
              <button aria-label="حذف از لیست" class="irs-remove" style="flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; border: 1px solid #ECEEF3; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M2.5 4.2h11M6.3 4.2V2.8h3.4v1.4M4 4.2l.7 9a1.2 1.2 0 0 0 1.2 1.1h4.2a1.2 1.2 0 0 0 1.2-1.1l.7-9" stroke="#DC2626" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </sc-if>

            <!-- toggle switch -->
            <div dir="ltr" style="width: 40px; height: 23px; border-radius: 999px; flex-shrink: 0; box-sizing: border-box; padding: 3px; display: flex; background: {{app.trackBg}};">
              <div style="width: 17px; height: 17px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 4px rgba(16,24,40,0.25); margin-inline-start: {{app.thumbOffset}};"></div>
            </div>

          </div>
        </sc-for>
      </div>
      </div>
    </div>

    <!-- confirm -->
    <div style="flex-shrink: 0; padding: 12px 18px 18px;">
      <button class="irs-confirm" style="width: 100%; height: 50px; border: none; border-radius: 14px; background: linear-gradient(180deg, #2447A8 0%, {{accent}} 100%); color: #FFFFFF; font-size: 14.5px; font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: 0 10px 20px -8px rgba(30,58,138,0.45); transition: transform 0.15s ease, box-shadow 0.15s ease;">تایید و ذخیره</button>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1E3A8A","options":["#1E3A8A","#1D4ED8","#0F2E6B","#1E293B"]},"splitOn":{"editor":"boolean","default":true,"section":"State"},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { splitOn: null };
  }
  renderVals() {
    const splitOn = this.state.splitOn ?? this.props.splitOn ?? true;
    const raw = [
      { name: 'MyApp.exe', category: 'افزوده‌شده به‌صورت دستی', color: '#64748B', kind: 'file', on: true, custom: true },
      { name: 'مرورگر وب', category: 'مرورگر اینترنت', color: '#1E3A8A', kind: 'browser', on: true },
      { name: 'پیام‌رسان تلگرام', category: 'پیام‌رسان', color: '#0EA5B7', kind: 'chat', on: true },
      { name: 'دیسکورد', category: 'گفتگوی صوتی و متنی', color: '#5B5FEF', kind: 'chat', on: false },
      { name: 'استیم', category: 'بازی', color: '#475569', kind: 'game', on: false },
      { name: 'اسپاتیفای', category: 'موسیقی', color: '#16A34A', kind: 'music', on: false },
      { name: 'آوت‌لوک', category: 'ایمیل', color: '#2563EB', kind: 'mail', on: true },
      { name: 'زوم', category: 'تماس تصویری', color: '#0369A1', kind: 'video', on: false },
    ];
    const apps = raw.map((a) => ({
      name: a.name,
      category: a.category,
      color: a.color,
      tint: a.color + '1A',
      isBrowser: a.kind === 'browser',
      isChat: a.kind === 'chat',
      isGame: a.kind === 'game',
      isMusic: a.kind === 'music',
      isMail: a.kind === 'mail',
      isVideo: a.kind === 'video',
      isFile: a.kind === 'file',
      isCustom: !!a.custom,
      trackBg: a.on
        ? 'linear-gradient(180deg, #22B37A 0%, #159A63 100%)'
        : '#DEE1E8',
      thumbOffset: a.on ? '17px' : '0px',
    }));
    return {
      accent: this.props.accent ?? '#1E3A8A',
      toggleSplit: () => this.setState({ splitOn: !splitOn }),
      splitStatusLabel: splitOn ? 'فعال — فقط برنامه‌های انتخاب‌شده از تونل عبور می‌کنند' : 'غیرفعال — همه ترافیک طبق روش اتصال اصلی',
      splitStatusColor: splitOn ? '#159A63' : '#9CA3B4',
      splitTrackBg: splitOn ? 'linear-gradient(180deg, #22B37A 0%, #159A63 100%)' : '#DEE1E8',
      splitThumbOffset: splitOn ? '20px' : '0px',
      listOpacity: splitOn ? '1' : '0.45',
      listPointer: splitOn ? 'auto' : 'none',
      apps,
      selectedCount: raw.filter((a) => a.on).length,
    };
  }
}
</script>
</body>
</html>
