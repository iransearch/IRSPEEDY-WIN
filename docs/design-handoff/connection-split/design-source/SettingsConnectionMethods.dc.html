<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>آی‌آر اسپیدی — روش‌های اتصال</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
  body { margin: 0; font-family: 'Vazirmatn', system-ui, sans-serif; }
  .irs-close:hover { transform: scale(1.06); }
  .irs-row:hover { border-color: #D8DCE6; box-shadow: 0 4px 12px rgba(16,24,40,0.07); transform: translateY(-1px); }
  .irs-row { transition: box-shadow 0.15s ease, transform 0.15s ease, border-color 0.15s ease; }
  .irs-confirm:hover { box-shadow: 0 12px 24px -8px rgba(30,58,138,0.5); transform: translateY(-1px); }
</style>
</helmet>

<div dir="rtl" style="width: 1280px; height: 640px; box-sizing: border-box; position: relative; display: flex; align-items: center; justify-content: center; background: radial-gradient(1100px 700px at 78% 12%, #EAF1FB 0%, #DCE6F5 38%, #CBD8ED 100%); overflow: hidden; font-family: 'Vazirmatn', sans-serif;">

  <!-- soft desktop taskbar hint, for context only -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: rgba(255,255,255,0.35); backdrop-filter: blur(6px); border-top: 1px solid rgba(255,255,255,0.5);"></div>

  <!-- floating window — sized exception: only 3 items, standard 700px height would look sparse -->
  <div dir="rtl" style="width: 420px; height: 460px; box-sizing: border-box; border-radius: 20px; background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%); box-shadow: 0 40px 80px -24px rgba(23,35,64,0.35), 0 0 0 1px rgba(255,255,255,0.6) inset; display: flex; flex-direction: column; overflow: hidden;">

    <!-- header -->
    <div style="height: 62px; flex-shrink: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: 0 18px; border-bottom: 1px solid #EEF0F4;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 1px;">
        <span style="font-size: 16px; font-weight: 800; color: #141B33; letter-spacing: 0.2px;">روش‌های اتصال</span>
        <span style="font-size: 10.5px; font-weight: 500; color: #9CA3B4;">فعال‌سازی و غیرفعال‌سازی روش‌های اتصال</span>
      </div>
      <button aria-label="بستن" class="irs-close" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; border: none; background: linear-gradient(180deg, #EF4444 0%, #DC2626 100%); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 14px -4px rgba(220,38,38,0.5); transition: transform 0.15s ease;">
        <svg width="12" height="12" viewBox="0 0 13 13" fill="none"><line x1="1.5" y1="1.5" x2="11.5" y2="11.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/><line x1="11.5" y1="1.5" x2="1.5" y2="11.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- content -->
    <div style="box-sizing: border-box; flex-grow: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 16px 16px; gap: 12px; overflow: hidden;">

      <sc-for list="{{items}}" as="item" hint-placeholder-count="4">
        <div class="irs-row" style="box-sizing: border-box; flex-shrink: 0; min-height: 60px; display: flex; align-items: center; gap: 11px; padding: 10px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #ECEEF3; box-shadow: 0 1px 3px rgba(16,24,40,0.03);">

          <!-- icon badge -->
          <div style="width: 36px; height: 36px; border-radius: 11px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{item.tint}};">
            <sc-if value="{{item.isGlobe}}" hint-placeholder-val="{{true}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#1E3A8A" stroke-width="1.7"/><path d="M4 12h16" stroke="#1E3A8A" stroke-width="1.7"/><path d="M12 4c-3 2.6-3 13.4 0 16" stroke="#1E3A8A" stroke-width="1.7" stroke-linecap="round"/><path d="M12 4c3 2.6 3 13.4 0 16" stroke="#1E3A8A" stroke-width="1.7" stroke-linecap="round"/></svg>
            </sc-if>
            <sc-if value="{{item.isStack}}" hint-placeholder-val="{{false}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="5" rx="1.6" stroke="#7C3AED" stroke-width="1.6"/><rect x="4" y="10.5" width="16" height="5" rx="1.6" stroke="#7C3AED" stroke-width="1.6"/><rect x="4" y="17" width="10" height="3" rx="1.4" stroke="#7C3AED" stroke-width="1.6"/></svg>
            </sc-if>
            <sc-if value="{{item.isRoute}}" hint-placeholder-val="{{false}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 7.5h5l3 4 3-4h5.5" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 5.2l2.5 2.3-2.5 2.3" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 16.5h5l3-4 3 4h5.5" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 18.8l2.5-2.3-2.5-2.3" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </sc-if>
            <sc-if value="{{item.isSplit}}" hint-placeholder-val="{{false}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 4.5v5" stroke="#0D9488" stroke-width="1.7" stroke-linecap="round"/><path d="M12 9.5c-4.2 0-6.3 2.1-6.3 6.1v2.9M12 9.5c4.2 0 6.3 2.1 6.3 6.1v2.9" stroke="#0D9488" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="3.3" r="1.7" fill="#0D9488"/><circle cx="5.7" cy="19.8" r="1.7" fill="#0D9488"/><circle cx="18.3" cy="19.8" r="1.7" fill="#0D9488"/></svg>
            </sc-if>
          </div>

          <!-- label + subtitle -->
          <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0;">
            <span style="font-size: 13.5px; font-weight: 700; color: #1B2033;">{{item.label}}</span>
            <span style="font-size: 10.5px; color: #9CA3B4; line-height: 1.25;">{{item.sub}}</span>
          </div>

          <!-- toggle switch (not on the split-tunnel row: it is switched on inside its own screen) -->
          <sc-if value="{{item.hasToggle}}" hint-placeholder-val="{{true}}">
            <div dir="ltr" style="width: 42px; height: 24px; border-radius: 999px; flex-shrink: 0; box-sizing: border-box; padding: 3px; display: flex; background: {{item.trackBg}};">
              <div style="width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 4px rgba(16,24,40,0.25); margin-inline-start: {{item.thumbOffset}};"></div>
            </div>
          </sc-if>

          <!-- split-tunnel row: read-only status instead of a toggle -->
          <sc-if value="{{item.isSplit}}" hint-placeholder-val="{{false}}">
            <span style="flex-shrink: 0; font-size: 11px; font-weight: 600; color: {{item.statusColor}};">{{item.statusLabel}}</span>
          </sc-if>

          <!-- drill-in chevron, shown only for rows that open another screen -->
          <sc-if value="{{item.isSplit}}" hint-placeholder-val="{{false}}">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink: 0;"><path d="M9 3.5L4.5 7 9 10.5" stroke="#C3C8D4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </sc-if>

        </div>
      </sc-for>

    </div>

    <!-- confirm -->
    <div style="flex-shrink: 0; padding: 0 16px 18px;">
      <button class="irs-confirm" style="width: 100%; height: 48px; border: none; border-radius: 14px; background: linear-gradient(180deg, #2447A8 0%, {{accent}} 100%); color: #FFFFFF; font-size: 14.5px; font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: 0 10px 20px -8px rgba(30,58,138,0.45); transition: transform 0.15s ease, box-shadow 0.15s ease;">تایید و ذخیره</button>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1E3A8A","options":["#1E3A8A","#1D4ED8","#0F2E6B","#1E293B"]},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { key: 'globe', color: '#1E3A8A', label: 'وی‌پی‌ان سراسری', sub: 'اتصال کل ترافیک سیستم به VPN', on: true },
      { key: 'stack', color: '#7C3AED', label: 'پروکسی سیستمی', sub: 'اعمال روی تنظیمات شبکه ویندوز', on: false },
      { key: 'route', color: '#F59E0B', label: 'پروکسی‌فایر', sub: 'مسیریابی هوشمند برنامه‌های خاص', on: false },
      { key: 'split', color: '#0D9488', label: 'تقسیم تونل', sub: 'انتخاب برنامه‌هایی که از تونل امن عبور کنند', on: false },
    ];
    return {
      accent: this.props.accent ?? '#1E3A8A',
      items: raw.map((s) => ({
        label: s.label,
        sub: s.sub,
        on: s.on,
        tint: s.color + '1A',
        isGlobe: s.key === 'globe',
        isStack: s.key === 'stack',
        isRoute: s.key === 'route',
        isSplit: s.key === 'split',
        hasToggle: s.key !== 'split',
        statusLabel: s.on ? 'فعال' : 'غیرفعال',
        statusColor: s.on ? '#159A63' : '#9CA3B4',
        trackBg: s.on
          ? 'linear-gradient(180deg, #22B37A 0%, #159A63 100%)'
          : '#DEE1E8',
        thumbOffset: s.on ? '18px' : '0px',
      })),
    };
  }
}
</script>
</body>
</html>
