<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>آی‌آر اسپیدی — تغییر رمز عبور</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
  body { margin: 0; font-family: 'Vazirmatn', system-ui, sans-serif; }
  .irs-close:hover { transform: scale(1.06); }
  .irs-field:focus-within { border-color: #1E3A8A; box-shadow: 0 0 0 3px rgba(30,58,138,0.12); }
  .irs-save:hover { box-shadow: 0 14px 28px -8px rgba(30,58,138,0.55); transform: translateY(-1px); }
  .irs-eye:hover { background: rgba(17,24,39,0.06); }
</style>
</helmet>

<div dir="rtl" style="width: 1280px; height: 640px; box-sizing: border-box; position: relative; display: flex; align-items: center; justify-content: center; background: radial-gradient(1100px 700px at 78% 12%, #EAF1FB 0%, #DCE6F5 38%, #CBD8ED 100%); overflow: hidden; font-family: 'Vazirmatn', sans-serif;">

  <!-- soft desktop taskbar hint, for context only -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: rgba(255,255,255,0.35); backdrop-filter: blur(6px); border-top: 1px solid rgba(255,255,255,0.5);"></div>

  <!-- floating window — sized to match Settings / Connection Methods -->
  <div dir="rtl" style="width: 420px; height: 460px; box-sizing: border-box; border-radius: 20px; background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%); box-shadow: 0 40px 80px -24px rgba(23,35,64,0.35), 0 0 0 1px rgba(255,255,255,0.6) inset; display: flex; flex-direction: column; overflow: hidden;">

    <!-- header -->
    <div style="height: 62px; flex-shrink: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: 0 18px; border-bottom: 1px solid #EEF0F4;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 1px;">
        <span style="font-size: 16px; font-weight: 800; color: #141B33; letter-spacing: 0.2px;">تغییر رمز عبور</span>
        <span style="font-size: 10.5px; font-weight: 500; color: #9CA3B4;">به‌روزرسانی رمز عبور حساب کاربری</span>
      </div>
      <button aria-label="بستن" class="irs-close" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; border: none; background: linear-gradient(180deg, #EF4444 0%, #DC2626 100%); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 14px -4px rgba(220,38,38,0.5); transition: transform 0.15s ease;">
        <svg width="12" height="12" viewBox="0 0 13 13" fill="none"><line x1="1.5" y1="1.5" x2="11.5" y2="11.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/><line x1="11.5" y1="1.5" x2="1.5" y2="11.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- content -->
    <div style="box-sizing: border-box; flex-grow: 1; min-height: 0; display: flex; flex-direction: column; padding: 14px 20px 12px; gap: 10px; overflow-y: auto;">

      <!-- lock badge -->
      <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
        <div style="width: 46px; height: 46px; border-radius: 14px; background: linear-gradient(180deg, #EFF5FF 0%, #E6F0FE 100%); box-shadow: 0 10px 18px -8px rgba(30,58,138,0.28), 0 0 0 1px rgba(201,219,251,0.7) inset; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="4.5" y="10.5" width="15" height="10.5" rx="2.6" stroke="{{accent}}" stroke-width="1.8"/><path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="15.6" r="1.6" fill="{{accent}}"/></svg>
        </div>
        <span style="font-size: 11px; color: #6B7280; line-height: 1.4; flex-grow: 1; min-width: 0;">رمز عبور خود را برای افزایش امنیت حساب به‌روزرسانی کنید</span>
      </div>

      <!-- form -->
      <div style="display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;">

        <!-- current password -->
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 11.5px; font-weight: 600; color: #5B6478;">رمز عبور فعلی</span>
          <label class="irs-field" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; border-radius: 11px; border: 1px solid #E1E4EC; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,24,40,0.03); transition: border-color 0.15s ease, box-shadow 0.15s ease;">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="3.2" y="7.2" width="9.6" height="6.8" rx="1.8" stroke="#9CA3B4" stroke-width="1.3"/><path d="M5.4 7.2V5a2.6 2.6 0 0 1 5.2 0v2.2" stroke="#9CA3B4" stroke-width="1.3"/></svg>
            <input type="password" placeholder="رمز عبور فعلی را وارد کنید" aria-label="رمز عبور فعلی" style="border: none; outline: none; background: transparent; font-size: 13px; color: #1F2433; font-family: inherit; flex-grow: 1; text-align: right;">
            <button aria-label="نمایش رمز عبور" class="irs-eye" style="width: 24px; height: 24px; border-radius: 7px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
              <svg width="16" height="16" viewBox="0 0 17 17" fill="none" aria-hidden="true"><path d="M1.8 8.5S4.4 3.8 8.5 3.8s6.7 4.7 6.7 4.7-2.6 4.7-6.7 4.7-6.7-4.7-6.7-4.7Z" stroke="#9CA3B4" stroke-width="1.3" stroke-linejoin="round"/><circle cx="8.5" cy="8.5" r="2" stroke="#9CA3B4" stroke-width="1.3"/></svg>
            </button>
          </label>
        </div>

        <!-- new password -->
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 11.5px; font-weight: 600; color: #5B6478;">رمز عبور جدید</span>
          <label class="irs-field" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; border-radius: 11px; border: 1px solid #E1E4EC; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,24,40,0.03); transition: border-color 0.15s ease, box-shadow 0.15s ease;">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="3.2" y="7.2" width="9.6" height="6.8" rx="1.8" stroke="#9CA3B4" stroke-width="1.3"/><path d="M5.4 7.2V5a2.6 2.6 0 0 1 5.2 0v2.2" stroke="#9CA3B4" stroke-width="1.3"/></svg>
            <input type="password" placeholder="رمز عبور جدید را وارد کنید" aria-label="رمز عبور جدید" style="border: none; outline: none; background: transparent; font-size: 13px; color: #1F2433; font-family: inherit; flex-grow: 1; text-align: right;">
            <button aria-label="نمایش رمز عبور" class="irs-eye" style="width: 24px; height: 24px; border-radius: 7px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
              <svg width="16" height="16" viewBox="0 0 17 17" fill="none" aria-hidden="true"><path d="M1.8 8.5S4.4 3.8 8.5 3.8s6.7 4.7 6.7 4.7-2.6 4.7-6.7 4.7-6.7-4.7-6.7-4.7Z" stroke="#9CA3B4" stroke-width="1.3" stroke-linejoin="round"/><circle cx="8.5" cy="8.5" r="2" stroke="#9CA3B4" stroke-width="1.3"/></svg>
            </button>
          </label>
        </div>

        <!-- repeat new password -->
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 11.5px; font-weight: 600; color: #5B6478;">تکرار رمز عبور جدید</span>
          <label class="irs-field" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; border-radius: 11px; border: 1px solid #E1E4EC; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,24,40,0.03); transition: border-color 0.15s ease, box-shadow 0.15s ease;">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="3.2" y="7.2" width="9.6" height="6.8" rx="1.8" stroke="#9CA3B4" stroke-width="1.3"/><path d="M5.4 7.2V5a2.6 2.6 0 0 1 5.2 0v2.2" stroke="#9CA3B4" stroke-width="1.3"/></svg>
            <input type="password" placeholder="رمز عبور جدید را دوباره وارد کنید" aria-label="تکرار رمز عبور جدید" style="border: none; outline: none; background: transparent; font-size: 14px; color: #1F2433; font-family: inherit; flex-grow: 1; text-align: right;">
            <button aria-label="نمایش رمز عبور" class="irs-eye" style="width: 26px; height: 26px; border-radius: 8px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
              <svg width="17" height="17" viewBox="0 0 17 17" fill="none" aria-hidden="true"><path d="M1.8 8.5S4.4 3.8 8.5 3.8s6.7 4.7 6.7 4.7-2.6 4.7-6.7 4.7-6.7-4.7-6.7-4.7Z" stroke="#9CA3B4" stroke-width="1.3" stroke-linejoin="round"/><circle cx="8.5" cy="8.5" r="2" stroke="#9CA3B4" stroke-width="1.3"/></svg>
            </button>
          </label>
          <span style="font-size: 11px; color: #9CA3B4; padding: 0 2px;">حداقل ۸ کاراکتر، شامل حروف و عدد</span>
        </div>
      </div>

      <!-- spacer -->
      <div style="flex-grow: 1;"></div>

      <!-- confirm -->
      <button class="irs-save" style="width: 100%; height: 50px; flex-shrink: 0; border: none; border-radius: 14px; background: linear-gradient(180deg, #2447A8 0%, {{accent}} 100%); color: #FFFFFF; font-size: 14.5px; font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: 0 10px 20px -8px rgba(30,58,138,0.45); transition: transform 0.15s ease, box-shadow 0.15s ease;">تغییر رمز عبور</button>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1E3A8A","options":["#1E3A8A","#1D4ED8","#0F2E6B","#1E293B"]},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#1E3A8A',
    };
  }
}
</script>
</body>
</html>
