<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>آی‌آر اسپیدی — در حال اتصال</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
  body { margin: 0; font-family: 'Vazirmatn', system-ui, sans-serif; }
  .irs-btn:hover { background: rgba(17,24,39,0.06); }

  @keyframes irsPulseGlow {
    0%, 100% { opacity: 0.55; transform: scale(0.96); }
    50% { opacity: 1; transform: scale(1.05); }
  }
  .irs-glow { animation: irsPulseGlow 2.2s ease-in-out infinite; }

  @keyframes irsBreath {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.045); }
  }
  .irs-badge { animation: irsBreath 2.2s ease-in-out infinite; }

  @keyframes irsDotFade {
    0%, 80%, 100% { opacity: 0.18; }
    40% { opacity: 1; }
  }
  .irs-dot { animation: irsDotFade 1.4s ease-in-out infinite; }
  .irs-dot:nth-child(1) { animation-delay: 0s; }
  .irs-dot:nth-child(2) { animation-delay: 0.18s; }
  .irs-dot:nth-child(3) { animation-delay: 0.36s; }

  @keyframes irsBarSweep {
    0% { transform: translateX(-64px); }
    100% { transform: translateX(200px); }
  }
  .irs-bar-sweep { animation: irsBarSweep 1.6s cubic-bezier(0.4,0,0.2,1) infinite; will-change: transform; }

  @keyframes irsLaserDash { to { stroke-dashoffset: -100; } }
  .irs-laser-dash { animation: irsLaserDash 1.2s linear infinite; }
</style>
</helmet>

<div dir="rtl" style="width: 1280px; height: 860px; box-sizing: border-box; position: relative; display: flex; align-items: center; justify-content: center; background: radial-gradient(1100px 700px at 78% 12%, #EAF1FB 0%, #DCE6F5 38%, #CBD8ED 100%); overflow: hidden; font-family: 'Vazirmatn', sans-serif;">

  <!-- soft desktop taskbar hint, for context only -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: rgba(255,255,255,0.35); backdrop-filter: blur(6px); border-top: 1px solid rgba(255,255,255,0.5);"></div>

  <!-- floating window -->
  <div dir="rtl" style="width: 420px; height: 700px; box-sizing: border-box; border-radius: 20px; background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%); box-shadow: 0 40px 80px -24px rgba(23,35,64,0.35), 0 0 0 1px rgba(255,255,255,0.6) inset; display: flex; flex-direction: column; overflow: hidden;">

    <!-- header -->
    <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; padding: 0 18px 0 12px; gap: 10px;">
      <img src="/_blob/2f27cbfce3e251e295dfdedc3f5db28c" alt="نشان آی‌آر اسپیدی، سپر و موشک" style="width: 22px; height: 29px; object-fit: contain; flex-shrink: 0;">
      <div dir="ltr" style="display: flex; align-items: baseline; gap: 8px; flex-grow: 1; min-width: 0;">
        <span style="font-size: 14px; font-weight: 700; color: #141B33; letter-spacing: 0.2px;">IRSPEEDY</span>
      </div>
      <button aria-label="کوچک کردن پنجره" class="irs-btn" style="width: 30px; height: 30px; border-radius: 8px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><line x1="1.5" y1="9.5" x2="10.5" y2="9.5" stroke="#5B6478" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button aria-label="بستن پنجره" class="irs-btn" style="width: 30px; height: 30px; border-radius: 8px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><line x1="1.5" y1="1.5" x2="10.5" y2="10.5" stroke="#5B6478" stroke-width="1.4" stroke-linecap="round"/><line x1="10.5" y1="1.5" x2="1.5" y2="10.5" stroke="#5B6478" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- content -->
    <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 32px; gap: 28px;">

      <!-- loader -->
      <div style="position: relative; width: 330px; height: 330px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">

        <!-- ambient glow -->
        <div class="irs-glow" style="position: absolute; inset: 8px; border-radius: 50%; background: radial-gradient(circle, rgba(30,58,138,0.20) 0%, rgba(30,58,138,0) 70%);"></div>

        <!-- static outer track -->
        <svg width="330" height="330" viewBox="0 0 330 330" style="position: absolute; inset: 0;">
          <circle cx="165" cy="165" r="148" fill="none" stroke="#E1E9FA" stroke-width="4"/>
        </svg>

        <!-- laser light circling the outer ring -->
        <svg width="330" height="330" viewBox="0 0 330 330" style="position: absolute; inset: 0; overflow: visible;">
          <defs>
            <filter id="irsLaserBlur" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="3"/>
            </filter>
          </defs>
          <!-- soft glow halo -->
          <circle cx="165" cy="165" r="148" fill="none" stroke="#2F6BFF" stroke-width="16" stroke-linecap="round" pathLength="100" stroke-dasharray="0.01 99.99" class="irs-laser-dash" opacity="0.55" filter="url(#irsLaserBlur)"/>
          <!-- laser dot core -->
          <circle cx="165" cy="165" r="148" fill="none" stroke="#2F6BFF" stroke-width="7" stroke-linecap="round" pathLength="100" stroke-dasharray="0.01 99.99" class="irs-laser-dash"/>
          <!-- hot white center -->
          <circle cx="165" cy="165" r="148" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="0.01 99.99" class="irs-laser-dash"/>
        </svg>

        <!-- static inner track -->
        <svg width="265" height="265" viewBox="0 0 265 265" style="position: absolute; inset: 33px;">
          <circle cx="132.5" cy="132.5" r="118" fill="none" stroke="#EEF1F8" stroke-width="3"/>
        </svg>

        <!-- center badge -->
        <div class="irs-badge" style="position: relative; width: 215px; height: 215px; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(239,245,255,0.97)); display: flex; align-items: center; justify-content: center; box-shadow: 0 18px 36px -12px rgba(30,58,138,0.38), 0 0 0 1px rgba(201,219,251,0.7) inset;">
          <img src="/_blob/2f27cbfce3e251e295dfdedc3f5db28c" alt="نشان آی‌آر اسپیدی" style="width: 148px; height: 199px; object-fit: contain;">
        </div>
      </div>

      <!-- status text -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 16px; font-weight: 700; color: #141B33;">در حال اتصال به سرویس</span>
          <span style="display: flex; align-items: center; gap: 3px;">
            <span class="irs-dot" style="width: 5px; height: 5px; border-radius: 50%; background: {{accent}};"></span>
            <span class="irs-dot" style="width: 5px; height: 5px; border-radius: 50%; background: {{accent}};"></span>
            <span class="irs-dot" style="width: 5px; height: 5px; border-radius: 50%; background: {{accent}};"></span>
          </span>
        </div>
        <span style="font-size: 12.5px; color: #9CA3B4;">در حال برقراری تونل امن، لطفاً چند لحظه صبر کنید</span>
      </div>

      <!-- indeterminate progress bar -->
      <div style="width: 200px; height: 5px; border-radius: 3px; background: #E7ECF6; overflow: hidden; position: relative; flex-shrink: 0;">
        <div class="irs-bar-sweep" style="position: absolute; top: 0; left: 0; bottom: 0; width: 64px; border-radius: 3px; background: linear-gradient(90deg, rgba(36,71,168,0) 0%, {{accent}} 50%, rgba(36,71,168,0) 100%);"></div>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1E3A8A","options":["#1E3A8A","#1D4ED8","#0F2E6B","#1E293B"]},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#1E3A8A',
    };
  }
}
</script>
</body>
</html>
