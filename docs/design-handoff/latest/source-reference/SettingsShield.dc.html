<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>آی‌آر اسپیدی — تنظیمات شیلد</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
  body { margin: 0; font-family: 'Vazirmatn', system-ui, sans-serif; }
  .irs-close:hover { transform: scale(1.06); }
  .irs-row:hover { border-color: #D8DCE6; box-shadow: 0 4px 12px rgba(16,24,40,0.07); transform: translateY(-1px); }
  .irs-row { transition: box-shadow 0.15s ease, transform 0.15s ease, border-color 0.15s ease; }
  .irs-confirm:hover { box-shadow: 0 12px 24px -8px rgba(30,58,138,0.5); transform: translateY(-1px); }
</style>
</helmet>

<div dir="rtl" style="width: 1280px; height: 860px; box-sizing: border-box; position: relative; display: flex; align-items: center; justify-content: center; background: radial-gradient(1100px 700px at 78% 12%, #EAF1FB 0%, #DCE6F5 38%, #CBD8ED 100%); overflow: hidden; font-family: 'Vazirmatn', sans-serif;">

  <!-- soft desktop taskbar hint, for context only -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: rgba(255,255,255,0.35); backdrop-filter: blur(6px); border-top: 1px solid rgba(255,255,255,0.5);"></div>

  <!-- floating window — STANDARD app window size, same as every other screen -->
  <div dir="rtl" style="width: 420px; height: 700px; box-sizing: border-box; border-radius: 20px; background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%); box-shadow: 0 40px 80px -24px rgba(23,35,64,0.35), 0 0 0 1px rgba(255,255,255,0.6) inset; display: flex; flex-direction: column; overflow: hidden;">

    <!-- header -->
    <div style="height: 62px; flex-shrink: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: 0 18px; border-bottom: 1px solid #EEF0F4;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 1px;">
        <span style="font-size: 16px; font-weight: 800; color: #141B33; letter-spacing: 0.2px;">تنظیمات شیلد</span>
        <span style="font-size: 10.5px; font-weight: 500; color: #9CA3B4;">محافظت هوشمند در برابر تهدیدهای آنلاین</span>
      </div>
      <button aria-label="بستن" class="irs-close" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; border: none; background: linear-gradient(180deg, #EF4444 0%, #DC2626 100%); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 14px -4px rgba(220,38,38,0.5); transition: transform 0.15s ease;">
        <svg width="12" height="12" viewBox="0 0 13 13" fill="none"><line x1="1.5" y1="1.5" x2="11.5" y2="11.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/><line x1="11.5" y1="1.5" x2="1.5" y2="11.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- content -->
    <div style="box-sizing: border-box; flex-grow: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 16px 16px; gap: 8px; overflow: hidden;">

      <sc-for list="{{items}}" as="item" hint-placeholder-count="8">
        <div class="irs-row" style="box-sizing: border-box; flex-shrink: 0; min-height: 60px; display: flex; align-items: center; gap: 11px; padding: 10px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #ECEEF3; box-shadow: 0 1px 3px rgba(16,24,40,0.03);">

          <!-- icon badge -->
          <div style="width: 36px; height: 36px; border-radius: 11px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{item.tint}};">
            <sc-if value="{{item.isAds}}" hint-placeholder-val="{{true}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 9.5v5h3.2l6 3.6V5.9l-6 3.6H3z" stroke="#F97316" stroke-width="1.6" stroke-linejoin="round"/><path d="M15.2 8.2c1.4 1.2 1.4 6.4 0 7.6" stroke="#F97316" stroke-width="1.6" stroke-linecap="round"/></svg>
            </sc-if>
            <sc-if value="{{item.isTracker}}" hint-placeholder-val="{{false}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M2.5 12s3.8-6.2 9.5-6.2 9.5 6.2 9.5 6.2-3.8 6.2-9.5 6.2S2.5 12 2.5 12z" stroke="#0EA5E9" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.8" stroke="#0EA5E9" stroke-width="1.6"/></svg>
            </sc-if>
            <sc-if value="{{item.isAdult}}" hint-placeholder-val="{{false}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3.5l9 16h-18l9-16z" stroke="#DC2626" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 10v4" stroke="#DC2626" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="17" r="0.9" fill="#DC2626"/></svg>
            </sc-if>
            <sc-if value="{{item.isSocial}}" hint-placeholder-val="{{false}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="6" cy="7" r="2.3" stroke="#7C3AED" stroke-width="1.6"/><circle cx="18" cy="7" r="2.3" stroke="#7C3AED" stroke-width="1.6"/><circle cx="12" cy="18" r="2.3" stroke="#7C3AED" stroke-width="1.6"/><path d="M7.7 8.6L10.6 16M16.3 8.6L13.4 16M8.3 7H15.7" stroke="#7C3AED" stroke-width="1.4" stroke-linecap="round"/></svg>
            </sc-if>
            <sc-if value="{{item.isCrypto}}" hint-placeholder-val="{{false}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.2" stroke="#CA8A04" stroke-width="1.6"/><path d="M12 6.5v11M9.3 9c0-1.1 1.1-2 2.7-2s2.7.9 2.7 2-1.2 1.7-2.7 1.7-2.7.8-2.7 1.9 1.2 2 2.7 2 2.7-.9 2.7-2" stroke="#CA8A04" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </sc-if>
            <sc-if value="{{item.isGambling}}" hint-placeholder-val="{{false}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="4.5" stroke="#DB2777" stroke-width="1.6"/><circle cx="8.6" cy="8.6" r="1.15" fill="#DB2777"/><circle cx="15.4" cy="8.6" r="1.15" fill="#DB2777"/><circle cx="12" cy="12" r="1.15" fill="#DB2777"/><circle cx="8.6" cy="15.4" r="1.15" fill="#DB2777"/><circle cx="15.4" cy="15.4" r="1.15" fill="#DB2777"/></svg>
            </sc-if>
            <sc-if value="{{item.isPhishing}}" hint-placeholder-val="{{false}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M8.5 4v9.5a3.5 3.5 0 1 0 7 0V11" stroke="#0D9488" stroke-width="1.6" stroke-linecap="round"/><circle cx="8.5" cy="4" r="1.3" stroke="#0D9488" stroke-width="1.4"/></svg>
            </sc-if>
            <sc-if value="{{item.isMalware}}" hint-placeholder-val="{{false}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="13.5" rx="5" ry="5.6" stroke="#475569" stroke-width="1.6"/><path d="M12 8V5.3M8.3 6.2L6.7 4.4M15.7 6.2l1.6-1.8M5.6 13.5H2.8M21.2 13.5h-2.8M6.6 18l-1.8 1.8M17.4 18l1.8 1.8" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/></svg>
            </sc-if>
          </div>

          <!-- label + status -->
          <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0;">
            <span style="font-size: 13.5px; font-weight: 700; color: #1B2033;">{{item.label}}</span>
            <span style="font-size: 10.5px; font-weight: 700; color: {{item.statusColor}};">{{item.statusText}}</span>
          </div>

          <!-- toggle switch -->
          <div dir="ltr" style="width: 42px; height: 24px; border-radius: 999px; flex-shrink: 0; box-sizing: border-box; padding: 3px; display: flex; background: {{item.trackBg}};">
            <div style="width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 4px rgba(16,24,40,0.25); margin-inline-start: {{item.thumbOffset}};"></div>
          </div>

        </div>
      </sc-for>

    </div>

    <!-- confirm -->
    <div style="flex-shrink: 0; padding: 0 16px 18px;">
      <button class="irs-confirm" style="width: 100%; height: 48px; border: none; border-radius: 14px; background: linear-gradient(180deg, #2447A8 0%, {{accent}} 100%); color: #FFFFFF; font-size: 14.5px; font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: 0 10px 20px -8px rgba(30,58,138,0.45); transition: transform 0.15s ease, box-shadow 0.15s ease;">تایید و ذخیره</button>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1E3A8A","options":["#1E3A8A","#1D4ED8","#0F2E6B","#1E293B"]},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { key: 'ads', color: '#F97316', label: 'تبلیغات گوگل', on: true },
      { key: 'tracker', color: '#0EA5E9', label: 'تبلیغات و ردیاب', on: true },
      { key: 'adult', color: '#DC2626', label: 'محتوای +۱۸', on: false },
      { key: 'social', color: '#7C3AED', label: 'شبکه‌های اجتماعی', on: false },
      { key: 'crypto', color: '#CA8A04', label: 'رمزارز', on: false },
      { key: 'gambling', color: '#DB2777', label: 'قمار', on: false },
      { key: 'phishing', color: '#0D9488', label: 'فیشینگ', on: true },
      { key: 'malware', color: '#475569', label: 'بدافزار', on: true },
    ];
    return {
      accent: this.props.accent ?? '#1E3A8A',
      items: raw.map((s) => ({
        label: s.label,
        on: s.on,
        tint: s.color + '1A',
        isAds: s.key === 'ads',
        isTracker: s.key === 'tracker',
        isAdult: s.key === 'adult',
        isSocial: s.key === 'social',
        isCrypto: s.key === 'crypto',
        isGambling: s.key === 'gambling',
        isPhishing: s.key === 'phishing',
        isMalware: s.key === 'malware',
        statusText: s.on ? 'این محتوا مسدود می‌شود' : 'این محتوا آزاد است',
        statusColor: s.on ? '#17A366' : '#DC2626',
        trackBg: s.on
          ? 'linear-gradient(180deg, #22B37A 0%, #159A63 100%)'
          : '#DEE1E8',
        thumbOffset: s.on ? '18px' : '0px',
      })),
    };
  }
}
</script>
</body>
</html>
