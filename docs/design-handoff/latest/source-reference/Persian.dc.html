<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>آی‌آر اسپیدی — پنجره فارسی (راست‌به‌چپ)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
  body { margin: 0; font-family: 'Vazirmatn', system-ui, sans-serif; }
  .irs-row:hover { background: #F3F5F9; }
  .irs-connect:hover { box-shadow: 0 14px 28px -8px rgba(30,58,138,0.55); transform: translateY(-1px); }
  .irs-scroll::-webkit-scrollbar { width: 6px; }
  .irs-scroll::-webkit-scrollbar-thumb { background: #D7DBE3; border-radius: 999px; }
  .irs-btn:hover { background: rgba(17,24,39,0.06); }

  /* a bright light travels the smart-location card's actual border perimeter at constant speed */
  .irs-shine-dash { animation: irsShineDash 1.6s linear infinite; }
  @keyframes irsShineDash {
    to { stroke-dashoffset: -100; }
  }
</style>
</helmet>

<div dir="rtl" style="width: 1280px; height: 860px; box-sizing: border-box; position: relative; display: flex; align-items: center; justify-content: center; background: radial-gradient(1100px 700px at 78% 12%, #EAF1FB 0%, #DCE6F5 38%, #CBD8ED 100%); overflow: hidden; font-family: 'Vazirmatn', sans-serif;">

  <!-- soft desktop taskbar hint, for context only -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: rgba(255,255,255,0.35); backdrop-filter: blur(6px); border-top: 1px solid rgba(255,255,255,0.5);"></div>

  <!-- floating window -->

    <!-- header -->
    <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; padding: 0 18px 0 12px; gap: 10px;">
      <img src="/_blob/2f27cbfce3e251e295dfdedc3f5db28c" alt="نشان آی‌آر اسپیدی، سپر و موشک" style="width: 24px; height: 32px; object-fit: contain; flex-shrink: 0;">
      <div dir="ltr" style="display: flex; align-items: baseline; gap: 8px; flex-grow: 1; min-width: 0;">
        <span style="font-size: 15px; font-weight: 700; color: #141B33; letter-spacing: 0.2px;">IRSPEEDY</span>
        <span style="font-size: 11px; font-weight: 500; color: #9CA3B4;">v1.4.5.8</span>
      </div>
      <button aria-label="تنظیمات" class="irs-btn" style="width: 30px; height: 30px; border-radius: 8px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" stroke="#5B6478" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="#5B6478" stroke-width="1.7"/></svg>
      </button>
      <button aria-label="خروج از حساب" class="irs-btn" style="width: 30px; height: 30px; border-radius: 8px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6.2 2H3.6A1.6 1.6 0 0 0 2 3.6v8.8A1.6 1.6 0 0 0 3.6 14h2.6" stroke="#5B6478" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 11l3-3-3-3" stroke="#5B6478" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.4 8H6" stroke="#5B6478" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <div style="width: 1px; height: 18px; background: #E1E4EC; flex-shrink: 0;"></div>
      <button aria-label="کوچک کردن پنجره" class="irs-btn" style="width: 30px; height: 30px; border-radius: 8px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><line x1="1.5" y1="9.5" x2="10.5" y2="9.5" stroke="#5B6478" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button aria-label="بستن پنجره" class="irs-btn" style="width: 30px; height: 30px; border-radius: 8px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><line x1="1.5" y1="1.5" x2="10.5" y2="10.5" stroke="#5B6478" stroke-width="1.4" stroke-linecap="round"/><line x1="10.5" y1="1.5" x2="1.5" y2="10.5" stroke="#5B6478" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- content -->
    <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; padding: 4px 18px 18px; gap: 12px;">

      <!-- search -->
      <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #E1E4EC; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,24,40,0.03); flex-shrink: 0;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5.25" stroke="#9CA3B4" stroke-width="1.5"/><line x1="11" y1="11" x2="14.5" y2="14.5" stroke="#9CA3B4" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input type="text" dir="rtl" placeholder="جستجوی سرورها" aria-label="جستجوی سرورها" style="border: none; outline: none; background: transparent; font-size: 14px; color: #1F2433; font-family: inherit; flex-grow: 1; text-align: right;">
      </label>

      <!-- smart selection, with a light that travels the actual perimeter at constant speed -->
      <div style="position: relative; flex-shrink: 0;">
        <button style="display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 13px 12px 9px; border-radius: 14px; border: 1px solid #C9DBFB; background: linear-gradient(180deg, #EFF5FF 0%, #E6F0FE 100%); cursor: pointer; width: 100%; box-sizing: border-box;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="width: 18px; height: 18px; border-radius: 50%; background: {{accent}}; box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 4px #C9DBFB; flex-shrink: 0;"></span>
            <div style="display: flex; align-items: center; gap: 7px; flex-grow: 1; min-width: 0;">
              <span style="font-size: 13px; font-weight: 700; color: #142057;">انتخاب هوشمند</span>
              <div dir="ltr" style="display: flex; align-items: center; gap: 3px;">
                <svg width="16" height="16" viewBox="0 0 38 38" style="border-radius: 50%; flex-shrink: 0;"><rect width="38" height="12.7" y="0" fill="#239F40"/><rect width="38" height="12.7" y="12.7" fill="#FFFFFF"/><rect width="38" height="12.6" y="25.4" fill="#DA0000"/></svg>
                <svg width="16" height="16" viewBox="0 0 38 38" style="border-radius: 50%; flex-shrink: 0;"><rect width="38" height="38" fill="#E30A17"/><circle cx="16.5" cy="19" r="8" fill="#FFFFFF"/><circle cx="19" cy="19" r="6.6" fill="#E30A17"/><polygon points="24,13.5 25.3,17.2 29.2,17.3 26.1,19.6 27.2,23.3 24,21.1 20.8,23.3 21.9,19.6 18.8,17.3 22.7,17.2" fill="#FFFFFF"/></svg>
                <svg width="16" height="16" viewBox="0 0 38 38" style="border-radius: 50%; flex-shrink: 0;"><rect width="38" height="12.7" y="0" fill="#141414"/><rect width="38" height="12.7" y="12.7" fill="#D0021B"/><rect width="38" height="12.6" y="25.4" fill="#F5C518"/></svg>
                <svg width="16" height="16" viewBox="0 0 38 38" style="border-radius: 50%; flex-shrink: 0;"><rect width="38" height="12.7" y="0" fill="#C8102E"/><rect width="38" height="12.7" y="12.7" fill="#FFFFFF"/><rect width="38" height="12.6" y="25.4" fill="#21468B"/></svg>
              </div>
            </div>
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0;"><path d="M13 2L4.5 13.5H11L9.5 22L19.5 9.5H13L13 2Z" fill="#F5B301" stroke="#F5B301" stroke-width="0.6" stroke-linejoin="round"/></svg>
          </div>
          <span style="font-size: 11px; color: #5B6BA8; text-align: right; padding-right: 26px;">بهترین سرور بر اساس موقعیت شما</span>
        </button>
        <svg width="384" height="70" viewBox="0 0 384 70" style="position: absolute; inset: -1px; pointer-events: none; overflow: visible;">
          <defs>
            <linearGradient id="irsShineGrad2" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#60A5FA" stop-opacity="0"/>
              <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
              <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <rect x="1" y="1" width="382" height="68" rx="13" ry="13" fill="none" stroke="url(#irsShineGrad2)" stroke-width="2" stroke-linecap="round" pathLength="100" stroke-dasharray="14 86" class="irs-shine-dash"/>
        </svg>
      </div>

      <!-- server list -->
      <div class="irs-scroll" style="flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; border-radius: 4px;">
        <sc-for list="{{servers}}" as="server" hint-placeholder-count="10">
          <div class="irs-row" style="display: flex; align-items: center; gap: 10px; padding: 9px 8px; border-radius: 10px; border-bottom: 1px solid #EEF0F4;">
            <span style="width: 20px; height: 20px; border-radius: 50%; border: 2px solid #D5D9E3; flex-shrink: 0; box-sizing: border-box;"></span>
            <div style="width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; overflow: hidden; box-shadow: 0 0 0 1px rgba(16,24,40,0.06);">
              <sc-if value="{{server.isGermany}}" hint-placeholder-val="{{true}}">
                <svg width="32" height="32" viewBox="0 0 38 38"><rect width="38" height="12.7" y="0" fill="#141414"/><rect width="38" height="12.7" y="12.7" fill="#D0021B"/><rect width="38" height="12.6" y="25.4" fill="#F5C518"/></svg>
              </sc-if>
              <sc-if value="{{server.isNetherlands}}" hint-placeholder-val="{{false}}">
                <svg width="32" height="32" viewBox="0 0 38 38"><rect width="38" height="12.7" y="0" fill="#C8102E"/><rect width="38" height="12.7" y="12.7" fill="#FFFFFF"/><rect width="38" height="12.6" y="25.4" fill="#21468B"/></svg>
              </sc-if>
              <sc-if value="{{server.isTurkey}}" hint-placeholder-val="{{false}}">
                <svg width="32" height="32" viewBox="0 0 38 38"><rect width="38" height="38" fill="#E30A17"/><circle cx="16.5" cy="19" r="8" fill="#FFFFFF"/><circle cx="19" cy="19" r="6.6" fill="#E30A17"/><polygon points="24,13.5 25.3,17.2 29.2,17.3 26.1,19.6 27.2,23.3 24,21.1 20.8,23.3 21.9,19.6 18.8,17.3 22.7,17.2" fill="#FFFFFF"/></svg>
              </sc-if>
              <sc-if value="{{server.isFrance}}" hint-placeholder-val="{{false}}">
                <svg width="32" height="32" viewBox="0 0 38 38"><rect width="12.7" height="38" x="0" fill="#0055A4"/><rect width="12.7" height="38" x="12.7" fill="#FFFFFF"/><rect width="12.6" height="38" x="25.4" fill="#EF4135"/></svg>
              </sc-if>
              <sc-if value="{{server.isUK}}" hint-placeholder-val="{{false}}">
                <svg width="32" height="32" viewBox="0 0 38 38"><rect width="38" height="38" fill="#0A17A7"/><path d="M0 0L38 38M38 0L0 38" stroke="#FFFFFF" stroke-width="7"/><path d="M0 0L38 38M38 0L0 38" stroke="#C8102E" stroke-width="2.6"/><path d="M19 0V38M0 19H38" stroke="#FFFFFF" stroke-width="11"/><path d="M19 0V38M0 19H38" stroke="#C8102E" stroke-width="6.5"/></svg>
              </sc-if>
              <sc-if value="{{server.isUSA}}" hint-placeholder-val="{{false}}">
                <svg width="32" height="32" viewBox="0 0 38 38"><rect width="38" height="38" fill="#FFFFFF"/><rect width="38" height="2.9" y="0" fill="#B22234"/><rect width="38" height="2.9" y="5.85" fill="#B22234"/><rect width="38" height="2.9" y="11.7" fill="#B22234"/><rect width="38" height="2.9" y="17.55" fill="#B22234"/><rect width="38" height="2.9" y="23.4" fill="#B22234"/><rect width="38" height="2.9" y="29.25" fill="#B22234"/><rect width="38" height="2.9" y="35.1" fill="#B22234"/><rect width="19" height="20.5" x="0" y="0" fill="#3C3B6E"/></svg>
              </sc-if>
              <sc-if value="{{server.isCanada}}" hint-placeholder-val="{{false}}">
                <svg width="32" height="32" viewBox="0 0 38 38"><rect width="38" height="38" fill="#FFFFFF"/><rect width="9.5" height="38" x="0" fill="#D80621"/><rect width="9.5" height="38" x="28.5" fill="#D80621"/><polygon points="19,9 21,16 27,14.5 23.5,19.5 27,20.5 22,22 23,28 19,24.5 15,28 16,22 11,20.5 14.5,19.5 11,14.5 17,16" fill="#D80621"/></svg>
              </sc-if>
              <sc-if value="{{server.isJapan}}" hint-placeholder-val="{{false}}">
                <svg width="32" height="32" viewBox="0 0 38 38"><rect width="38" height="38" fill="#FFFFFF"/><circle cx="19" cy="19" r="10.5" fill="#BC002D"/></svg>
              </sc-if>
              <sc-if value="{{server.isUAE}}" hint-placeholder-val="{{false}}">
                <svg width="32" height="32" viewBox="0 0 38 38"><rect width="38" height="12.7" y="0" fill="#00732F"/><rect width="38" height="12.6" y="12.7" fill="#FFFFFF"/><rect width="38" height="12.7" y="25.3" fill="#000000"/><rect width="11" height="38" x="0" fill="#FF0000"/></svg>
              </sc-if>
              <sc-if value="{{server.isSingapore}}" hint-placeholder-val="{{false}}">
                <svg width="32" height="32" viewBox="0 0 38 38"><rect width="38" height="19" y="0" fill="#EF3340"/><rect width="38" height="19" y="19" fill="#FFFFFF"/><circle cx="11" cy="9.5" r="5.4" fill="#FFFFFF"/><circle cx="13" cy="9.5" r="4.4" fill="#EF3340"/></svg>
              </sc-if>
            </div>
            <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0; text-align: right;">
              <span style="font-size: 14.5px; font-weight: 600; color: #1B2033;">{{server.label}}</span>
            </div>
            <span dir="ltr" style="font-size: 13px; font-weight: 700; color: {{server.pingColor}}; flex-shrink: 0;">{{server.ping}} ms</span>
          </div>
        </sc-for>
      </div>

      <!-- connect button -->
      <button class="irs-connect" style="height: 56px; flex-shrink: 0; border: none; border-radius: 14px; background: linear-gradient(180deg, #2447A8 0%, {{accent}} 100%); color: #FFFFFF; font-size: 15px; font-weight: 700; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; box-shadow: 0 10px 22px -8px rgba(30,58,138,0.5); transition: transform 0.15s ease, box-shadow 0.15s ease;">
        اتصال
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13 8H3M7 4L3 8l4 4" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1E3A8A","options":["#1E3A8A","#1D4ED8","#0F2E6B","#1E293B"]},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { kind: 'germany', label: 'فرانکفورت - آلمان', ping: 38 },
      { kind: 'netherlands', label: 'آمستردام - هلند', ping: 42 },
      { kind: 'turkey', label: 'استانبول - ترکیه', ping: 62 },
      { kind: 'france', label: 'پاریس - فرانسه', ping: 68 },
      { kind: 'uk', label: 'لندن - انگلستان', ping: 76 },
      { kind: 'usa', label: 'نیویورک - آمریکا', ping: 63 },
      { kind: 'canada', label: 'تورنتو - کانادا', ping: 70 },
      { kind: 'uae', label: 'دبی - امارات', ping: 29 },
      { kind: 'singapore', label: 'سنگاپور - سنگاپور', ping: 82 },
      { kind: 'japan', label: 'توکیو - ژاپن', ping: 75 },
    ];
    return {
      accent: this.props.accent ?? '#1E3A8A',
      servers: raw.map((s) => ({
        ...s,
        isGermany: s.kind === 'germany',
        isNetherlands: s.kind === 'netherlands',
        isTurkey: s.kind === 'turkey',
        isFrance: s.kind === 'france',
        isUK: s.kind === 'uk',
        isUSA: s.kind === 'usa',
        isCanada: s.kind === 'canada',
        isUAE: s.kind === 'uae',
        isSingapore: s.kind === 'singapore',
        isJapan: s.kind === 'japan',
        pingColor: s.ping <= 45 ? '#17A366' : s.ping <= 75 ? '#F59E0B' : '#DC2626',
      })),
    };
  }
}
</script>
</body>
</html>
