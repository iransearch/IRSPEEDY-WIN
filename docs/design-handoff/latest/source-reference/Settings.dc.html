<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>آی‌آر اسپیدی — تنظیمات سرویس</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
  body { margin: 0; font-family: 'Vazirmatn', system-ui, sans-serif; }
  .irs-close:hover { transform: scale(1.06); }
  .irs-row:hover { border-color: #D8DCE6; box-shadow: 0 4px 12px rgba(16,24,40,0.07); transform: translateY(-1px); }
  .irs-row { transition: box-shadow 0.15s ease, transform 0.15s ease, border-color 0.15s ease; }
  .irs-confirm:hover { box-shadow: 0 12px 24px -8px rgba(30,58,138,0.5); transform: translateY(-1px); }
</style>
</helmet>

<div dir="rtl" style="width: 1280px; height: 860px; box-sizing: border-box; position: relative; display: flex; align-items: center; justify-content: center; background: radial-gradient(1100px 700px at 78% 12%, #EAF1FB 0%, #DCE6F5 38%, #CBD8ED 100%); overflow: hidden; font-family: 'Vazirmatn', sans-serif;">

  <!-- soft desktop taskbar hint, for context only -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: rgba(255,255,255,0.35); backdrop-filter: blur(6px); border-top: 1px solid rgba(255,255,255,0.5);"></div>

  <!-- floating window — STANDARD app window size, same as every other screen -->
  <div dir="rtl" style="width: 420px; height: 700px; box-sizing: border-box; border-radius: 20px; background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%); box-shadow: 0 40px 80px -24px rgba(23,35,64,0.35), 0 0 0 1px rgba(255,255,255,0.6) inset; display: flex; flex-direction: column; overflow: hidden;">

    <!-- header -->
    <div style="height: 62px; flex-shrink: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: 0 18px; border-bottom: 1px solid #EEF0F4;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 1px;">
        <span style="font-size: 16px; font-weight: 800; color: #141B33; letter-spacing: 0.2px;">تنظیمات سرویس</span>
        <span style="font-size: 10.5px; font-weight: 500; color: #9CA3B4;">شخصی‌سازی رفتار اتصال</span>
      </div>
      <button aria-label="بستن" class="irs-close" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; border: none; background: linear-gradient(180deg, #EF4444 0%, #DC2626 100%); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 14px -4px rgba(220,38,38,0.5); transition: transform 0.15s ease;">
        <svg width="12" height="12" viewBox="0 0 13 13" fill="none"><line x1="1.5" y1="1.5" x2="11.5" y2="11.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/><line x1="11.5" y1="1.5" x2="1.5" y2="11.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- content -->
    <div style="box-sizing: border-box; flex-grow: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 16px 16px; gap: 10px; overflow: hidden;">

      <sc-for list="{{items}}" as="item" hint-placeholder-count="6">
        <div class="irs-row" style="box-sizing: border-box; flex-shrink: 0; min-height: 72px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #ECEEF3; box-shadow: 0 1px 3px rgba(16,24,40,0.03);">

          <!-- icon badge -->
          <div style="width: 42px; height: 42px; border-radius: 13px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{item.tint}};">
            <sc-if value="{{item.isMethods}}" hint-placeholder-val="{{true}}">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><line x1="4" y1="7" x2="20" y2="7" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round"/><circle cx="9" cy="7" r="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/><line x1="4" y1="12.5" x2="20" y2="12.5" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round"/><circle cx="15.5" cy="12.5" r="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/><line x1="4" y1="18" x2="20" y2="18" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round"/><circle cx="7.5" cy="18" r="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/></svg>
            </sc-if>
            <sc-if value="{{item.isShield}}" hint-placeholder-val="{{false}}">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 5-3 8.5-7 10-4-1.5-7-5-7-10V6l7-3z" stroke="#16A34A" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 12l2.2 2.2L15.5 9.5" stroke="#16A34A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </sc-if>
            <sc-if value="{{item.isShare}}" hint-placeholder-val="{{false}}">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M12 19.5v-3" stroke="#0891B2" stroke-width="1.7" stroke-linecap="round"/><path d="M8.3 14.3a5.2 5.2 0 0 1 7.4 0" stroke="#0891B2" stroke-width="1.7" stroke-linecap="round"/><path d="M5.3 11.3a9.4 9.4 0 0 1 13.4 0" stroke="#0891B2" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="18.3" r="1.1" fill="#0891B2"/></svg>
            </sc-if>
            <sc-if value="{{item.isPad}}" hint-placeholder-val="{{false}}">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><rect x="2.6" y="8" width="18.8" height="9.4" rx="4.2" stroke="#6366F1" stroke-width="1.6"/><path d="M8 10.8v4M6 12.8h4" stroke="#6366F1" stroke-width="1.5" stroke-linecap="round"/><circle cx="16.2" cy="11.3" r="1.05" fill="#6366F1"/><circle cx="18.2" cy="13.3" r="1.05" fill="#6366F1"/></svg>
            </sc-if>
            <sc-if value="{{item.isSpark}}" hint-placeholder-val="{{false}}">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><circle cx="10" cy="12.5" r="7.2" stroke="#EC4899" stroke-width="1.6"/><path d="M8.2 9.4v6l4.8-3-4.8-3z" stroke="#EC4899" stroke-width="1.5" stroke-linejoin="round"/><path d="M18 4l0.9 2.2L21 7l-2.1 0.9L18 10l-0.9-2.1L15 7l2.1-0.8L18 4z" fill="#EC4899"/></svg>
            </sc-if>
            <sc-if value="{{item.isPassword}}" hint-placeholder-val="{{false}}">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><circle cx="8" cy="12" r="4" stroke="#64748B" stroke-width="1.7"/><path d="M11.5 12h9M17 12v3M20 12v3" stroke="#64748B" stroke-width="1.7" stroke-linecap="round"/></svg>
            </sc-if>
          </div>

          <!-- label + subtitle -->
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
            <span style="font-size: 14.5px; font-weight: 700; color: #1B2033;">{{item.label}}</span>
            <span style="font-size: 11px; color: #9CA3B4; line-height: 1.3;">{{item.sub}}</span>
          </div>

          <!-- trailing action: toggle switch OR nav chevron -->
          <sc-if value="{{item.isNav}}" hint-placeholder-val="{{true}}">
            <div style="width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #F5F6F9;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="#B7BCC9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </sc-if>
          <sc-if value="{{item.isToggle}}" hint-placeholder-val="{{false}}">
            <div dir="ltr" style="box-sizing: border-box; width: 46px; height: 27px; border-radius: 999px; flex-shrink: 0; padding: 3px; display: flex; background: {{item.trackBg}};">
              <div style="width: 21px; height: 21px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 4px rgba(16,24,40,0.25); margin-inline-start: {{item.thumbOffset}};"></div>
            </div>
          </sc-if>

        </div>
      </sc-for>

    </div>

    <!-- confirm -->
    <div style="flex-shrink: 0; padding: 0 16px 18px;">
      <button class="irs-confirm" style="width: 100%; height: 50px; border: none; border-radius: 14px; background: linear-gradient(180deg, #2447A8 0%, {{accent}} 100%); color: #FFFFFF; font-size: 14.5px; font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: 0 10px 20px -8px rgba(30,58,138,0.45); transition: transform 0.15s ease, box-shadow 0.15s ease;">تایید و ذخیره</button>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1E3A8A","options":["#1E3A8A","#1D4ED8","#0F2E6B","#1E293B"]},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { key: 'methods', color: '#2563EB', label: 'روش‌های اتصال', sub: 'وی‌پی‌ان سراسری، پروکسی سیستمی، پروکسی‌فایر', nav: true, on: false },
      { key: 'shield', color: '#16A34A', label: 'شیلد', sub: 'محافظت در برابر تبلیغات و تهدیدهای آنلاین', nav: true, on: false },
      { key: 'share', color: '#0891B2', label: 'اشتراک‌گذاری اتصال', sub: 'تبدیل این دستگاه به نقطه اتصال VPN', nav: true, on: false },
      { key: 'pad', color: '#6366F1', label: 'حالت بازی', sub: 'کاهش تاخیر برای بازی‌های آنلاین', nav: false, on: false },
      { key: 'spark', color: '#EC4899', label: 'هوش مصنوعی', sub: 'IP ثابت جهت دسترسی به سرویس هوش مصنوعی', nav: false, on: true },
      { key: 'password', color: '#64748B', label: 'تغییر رمز عبور', sub: 'به‌روزرسانی رمز عبور حساب کاربری', nav: true, on: false },
    ];
    return {
      accent: this.props.accent ?? '#1E3A8A',
      items: raw.map((s) => ({
        label: s.label,
        sub: s.sub,
        on: s.on,
        isNav: s.nav,
        isToggle: !s.nav,
        tint: s.color + '1A',
        isMethods: s.key === 'methods',
        isShield: s.key === 'shield',
        isShare: s.key === 'share',
        isPad: s.key === 'pad',
        isSpark: s.key === 'spark',
        isPassword: s.key === 'password',
        trackBg: s.on
          ? 'linear-gradient(180deg, #22B37A 0%, #159A63 100%)'
          : '#DEE1E8',
        thumbOffset: s.on ? '19px' : '0px',
      })),
    };
  }
}
</script>
</body>
</html>
