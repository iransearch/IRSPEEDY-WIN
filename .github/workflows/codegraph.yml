name: Incremental Code Knowledge Graph

on:
  push:
    branches: [agent/core-startup-diagnostics-fix]
  pull_request:
    branches: [agent/core-startup-diagnostics-fix]

permissions:
  contents: read

concurrency:
  group: codegraph-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test incremental analysis and publication guards
        run: python3 -m unittest discover -s tests/CodegraphChecks -p 'test_*.py' -v
      - name: Read-only graph trial
        run: >-
          python3 tools/codegraph/update.py --dry-run --target "$GITHUB_SHA"
          --report "$RUNNER_TEMP/codegraph-trial.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload trial report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codegraph-trial-${{ github.run_id }}
          path: ${{ runner.temp }}/codegraph-trial.json
          if-no-files-found: warn

  sync:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/core-startup-diagnostics-fix'
    needs: checks
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Update only changed graph inputs
        run: >-
          python3 tools/codegraph/update.py --target "$GITHUB_SHA"
          --report "$RUNNER_TEMP/codegraph-sync.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Publish graph outputs with branch and race guards
        run: python3 tools/codegraph/publish.py --report "$RUNNER_TEMP/codegraph-sync.json"
      - name: Upload final report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codegraph-sync-${{ github.run_id }}
          path: ${{ runner.temp }}/codegraph-sync.json
          if-no-files-found: warn
